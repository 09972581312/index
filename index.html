<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Logout Dashboard System</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .login-box, .dashboard {
    background: #fff;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    width: 350px;
    text-align: center;
  }
  .login-box input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-sizing: border-box;
  }
  .login-box button, .logout-btn {
    width: 100%;
    padding: 12px;
    background: #2a5298;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    margin-top: 10px;
  }
  .login-box button:hover, .logout-btn:hover {
    background: #1e3c72;
  }
  .dashboard {
    display: none;
  }
  .error {
    color: red;
    font-size: 14px;
    margin-top: 10px;
  }
  .info {
    text-align: left;
    margin: 20px 0;
    line-height: 1.8;
    background: #f5f7fa;
    padding: 15px;
    border-radius: 8px;
  }
</style>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } 
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "XXXXXXX",
    appId: "1:XXXXXXX:web:XXXXXXX"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const loginBox = document.getElementById("loginBox");
  const dashboard = document.getElementById("dashboard");
  const loginBtn = document.getElementById("loginBtn");
  const logoutBtn = document.getElementById("logoutBtn");
  const errorMsg = document.getElementById("errorMsg");

  onAuthStateChanged(auth, (user) => {
    if (user) {
      loginBox.style.display = "none";
      dashboard.style.display = "block";
      document.getElementById("userEmail").innerText = user.email;
      document.getElementById("userName").innerText = "Ramin S. Kamsoy";
      document.getElementById("userCourse").innerText = "Bachelor of Science in Information System";
      document.getElementById("userAddress").innerText = "Nonoyan, Baliguian, Zamboanga del Norte";
    } else {
      loginBox.style.display = "block";
      dashboard.style.display = "none";
    }
  });

  loginBtn.addEventListener("click", () => {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    
    signInWithEmailAndPassword(auth, email, password)
      .then(() => {
        errorMsg.innerText = "";
      })
      .catch(() => {
        errorMsg.innerText = "Invalid email or password!";
      });
  });

  logoutBtn.addEventListener("click", () => {
    signOut(auth);
  });
</script>
</head>

<body>
  <div class="login-box" id="loginBox">
    <h2>Login</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button id="loginBtn">Login</button>
    <div class="error" id="errorMsg"></div>
  </div>

  <div class="dashboard" id="dashboard">
    <h2>Welcome to Dashboard</h2>
    <div class="info">
      <p><strong>Name:</strong> <span id="userName"></span></p>
      <p><strong>Email:</strong> <span id="userEmail"></span></p>
      <p><strong>Course:</strong> <span id="userCourse"></span></p>
      <p><strong>Address:</strong> <span id="userAddress"></span></p>
    </div>
    <button class="logout-btn" id="logoutBtn">Logout</button>
  </div>
</body>
</html>
